<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png" sizes="192x192">
<meta name="theme-color" content="#155E4B">
<title>Notre Famille V42</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Noto+Sans+Ethiopic:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--fond:#FBF6EC;--carte:#fff;--ligne:#E6DAC4;--vert:#155E4B;--or:#D89A2B;--henne:#8C3B22;--txt:#2A2318;--doux:#8A7A5F;--r:16px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans','Noto Sans Ethiopic','Noto Naskh Arabic',sans-serif;background:var(--fond);color:var(--txt);font-size:15px}
body.nuit{--fond:#171208;--carte:#241C0E;--ligne:#3A2F1B;--txt:#F1E6CE;--doux:#B5A585}
h1,h2,h3{font-family:'Unbounded',sans-serif;letter-spacing:-.02em}
#app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{background:var(--vert);color:#fff;padding:16px 18px 12px;position:sticky;top:0;z-index:20}
header h1{font-size:19px}header h1 span{color:var(--or)}
header .sal{font-size:12.5px;opacity:.9;margin-top:3px}
.natte{height:8px;background:repeating-linear-gradient(90deg,var(--or) 0 14px,var(--henne) 14px 28px,#2E3A87 28px 42px,#fff 42px 44px)}
.topbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.topbar select,.topbar button{border:none;border-radius:9px;padding:7px 10px;font-size:12.5px;font-family:inherit;background:rgba(255,255,255,.16);color:#fff;cursor:pointer}
.topbar select option{color:#222}
main{flex:1;padding:14px 16px 92px}
.ecr{display:none}.ecr.on{display:block;animation:f .25s}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.carte{background:var(--carte);border:1.5px solid var(--ligne);border-radius:var(--r);padding:14px;margin-bottom:12px}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}
.sect h2{font-size:15px}
.hint{font-size:12.5px;color:var(--doux);line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.s1{background:var(--carte);border:1.5px solid var(--ligne);border-radius:12px;padding:10px 4px;text-align:center}
.s1 b{font-size:19px;display:block;color:var(--vert)}
body.nuit .s1 b{color:var(--or)}
.s1 small{font-size:10px;color:var(--doux)}
input,select,textarea{font-family:inherit;font-size:14px;border:1.5px solid var(--ligne);border-radius:11px;padding:10px 12px;background:var(--carte);color:var(--txt);width:100%}
.btn{border:none;border-radius:11px;padding:11px 15px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
.btn.p{background:var(--vert);color:#fff}.btn.o{background:var(--or);color:#3A2A08}
.btn.g{background:none;border:1.5px solid var(--ligne);color:var(--txt)}
.btn.small{padding:7px 11px;font-size:12px;border-radius:9px}
.frow{display:flex;gap:8px;margin-top:8px}.frow>*{flex:1}
.lb{font-size:11.5px;font-weight:700;color:var(--doux);display:block;margin:9px 0 4px}
.membre{display:flex;gap:11px;align-items:center;background:var(--carte);border:1.5px solid var(--ligne);border-radius:13px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.membre .av{width:44px;height:44px;border-radius:50%;background:var(--fond);display:grid;place-items:center;font-size:22px;border:2px solid var(--or);flex-shrink:0}
.membre b{font-size:14px}.membre small{display:block;color:var(--doux);font-size:11.5px}
.gen{font-size:10px;font-weight:700;background:var(--vert);color:#fff;border-radius:6px;padding:2px 7px;margin-inline-start:auto}
.arbre ul{list-style:none;padding-inline-start:20px;border-inline-start:2px dashed var(--ligne);margin-inline-start:9px}
.noeud{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
.noeud .pli{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--ligne);background:var(--carte);font-size:11px;display:grid;place-items:center;flex-shrink:0;color:var(--txt)}
.noeud .nm{font-size:13.5px;font-weight:600}
.noeud .nm small{color:var(--doux);font-weight:400}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1.5px solid var(--ligne);background:var(--carte);border-radius:15px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--doux);font-family:inherit}
.chip.on{background:var(--vert);color:#fff;border-color:var(--vert)}
.frise{border-inline-start:3px solid var(--or);padding-inline-start:14px}
.ev{position:relative;padding:8px 0}
.ev b{font-size:13.5px}.ev small{color:var(--doux);display:block;font-size:11.5px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--carte);border-top:1.5px solid var(--ligne);display:flex;padding:8px 4px 12px;z-index:30}
nav button{flex:1;border:none;background:none;font-size:19px;color:var(--doux);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:inherit}
nav button small{font-size:9.5px;font-weight:700}
nav button.on{color:var(--vert)}body.nuit nav button.on{color:var(--or)}
#fiche{position:fixed;inset:0;z-index:60;display:none}#fiche.on{display:block}
#fiche .fd{position:absolute;inset:0;background:rgba(15,10,3,.6)}
#fiche .pan{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;max-height:86dvh;overflow-y:auto;background:var(--fond);border-radius:22px 22px 0 0;padding:18px 20px 26px}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--vert);color:#fff;padding:10px 17px;border-radius:13px;font-size:13px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.livre .m1{padding:9px 0;border-bottom:1.5px dashed var(--ligne);font-size:13.5px}
.livre .m1:last-child{border:none}.livre small{color:var(--doux)}
.reactF{border:none;background:var(--fond);border-radius:11px;padding:2px 9px;font-size:12px;cursor:pointer;margin-top:5px;color:var(--txt);font-family:inherit}
.diasp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.d1{background:var(--carte);border:1.5px solid var(--ligne);border-radius:12px;padding:10px 4px;text-align:center}
.d1 b{font-size:20px;display:block}.d1 small{font-size:10.5px;color:var(--doux);display:block}
.ringF{width:86px;height:86px;border-radius:50%;position:relative;display:grid;place-items:center;flex-shrink:0}
.ringF i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--or) var(--deg,0deg),var(--ligne) 0)}
.ringF b{position:relative;background:var(--fond);width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.ldrF{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1.5px dashed var(--ligne);font-size:13.5px}
.ldrF:last-child{border:none}.ldrF span:last-child{margin-inline-start:auto;color:var(--doux);font-size:12px}
.diapo{text-align:center;padding:22px 10px}.diapo .av{font-size:64px}
.confF{position:fixed;top:-12px;font-size:17px;z-index:95;animation:chF 2.3s linear forwards;pointer-events:none}
@keyframes chF{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
html[dir=rtl] .gen,html[dir=rtl] .ldrF span:last-child{margin-inline-start:auto}

/* ── V36 : Studio + modernisation ── */
header{background:linear-gradient(135deg,var(--vert) 0%,#0E4739 60%,#123F33 100%)}
header h1{font-size:20px;font-weight:900}
.carte{box-shadow:0 1px 2px rgba(42,35,24,.04);transition:transform .12s}
.btn{transition:transform .1s,filter .15s}.btn:active{transform:scale(.96)}
.btn.p{box-shadow:0 2px 0 rgba(0,0,0,.12)}
.membre{transition:transform .12s,border-color .15s}
.membre:active{transform:scale(.985);border-color:var(--or)}
.s1 b{font-variant-numeric:tabular-nums}
.stHead{display:flex;gap:13px;align-items:center;background:linear-gradient(135deg,var(--vert),#0E4739);color:#fff;border:none}
.stHead b{font-family:'Unbounded',sans-serif;font-size:14.5px}
.stHead .hint{color:rgba(255,255,255,.78);margin-top:2px}
.sgt{font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--or);margin:16px 3px 8px}
.tuiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tuile{background:var(--carte);border:1.5px solid var(--ligne);border-radius:15px;padding:13px 6px 11px;
 display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-family:inherit;
 color:var(--txt);transition:transform .12s,border-color .15s}
.tuile:active{transform:scale(.95);border-color:var(--or)}
.tuile i{font-size:23px;font-style:normal;line-height:1}
.tuile b{font-size:10.5px;font-weight:700;text-align:center;line-height:1.25;color:var(--doux)}
.lienB{font-family:ui-monospace,monospace;font-size:11.5px;word-break:break-all;background:var(--fond);
 border-radius:10px;padding:9px;margin-bottom:9px;border:1.5px dashed var(--ligne)}
.bar{height:9px;background:var(--fond);border:1.5px solid var(--ligne);border-radius:7px;overflow:hidden;margin:7px 0 3px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--or),#EFC069)}
.lgn{display:flex;gap:11px;align-items:center}
.ck{width:29px;height:29px;flex-shrink:0;border-radius:50%;border:2px solid var(--ligne);background:var(--carte);
 color:#fff;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
.ck.ok{background:var(--vert);border-color:var(--vert)}
.grilleM{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:1;background:var(--vert);color:var(--or);border-radius:12px;display:grid;place-items:center;
 font-size:25px;cursor:pointer;user-select:none;transition:transform .12s}
.mc:active{transform:scale(.94)}
.clav{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px;justify-content:center}
.tch{width:32px;height:36px;border:1.5px solid var(--ligne);background:var(--carte);border-radius:9px;
 font-weight:700;cursor:pointer;font-family:inherit;color:var(--txt);font-size:13px}
.tch:disabled{opacity:.3}
.wrp{background:linear-gradient(135deg,var(--vert),#0E4739);color:#fff;border-radius:16px;padding:15px;
 margin-bottom:9px;text-align:center}
.wrp b{font-size:34px;display:block;color:var(--or);font-family:'Unbounded',sans-serif;line-height:1.1}
.wrp span{font-size:12px;opacity:.85}

/* ── Photothèque ── */
.phG{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.phC{background:var(--carte);border:1.5px solid var(--ligne);border-radius:13px;padding:5px 3px 6px;
 cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
.phC.ok{border-color:var(--or);box-shadow:0 2px 7px rgba(216,154,43,.2)}
.phC .pt{width:100%;height:auto;aspect-ratio:1;border-radius:10px}
.phC small{font-size:9px;color:var(--doux);line-height:1.15;text-align:center;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

/* ── V40 : portraits ── */
.pt{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.av,.avL,.avS{overflow:hidden;padding:0}
.avG{width:96px;height:96px;margin:0 auto;border-radius:50%;overflow:hidden;
 border:3px solid var(--or);box-shadow:0 3px 10px rgba(42,35,24,.2)}
.mc .pt{border-radius:9px}
.mc{padding:3px}
.phB{display:flex;gap:6px;justify-content:center;margin:9px 0 4px;flex-wrap:wrap}
.pt.vide{display:grid;place-items:center;font-size:17px}

/* ── V39 : discussion ── */
.ecrB{border-color:var(--or)}
.avS{width:30px;height:30px;flex:none;border-radius:50%;background:var(--fond);display:grid;
 place-items:center;font-size:15px;border:1.5px solid var(--ligne)}
.msgB{background:var(--carte);border:1.5px solid var(--ligne);border-radius:15px;padding:11px 13px;margin-bottom:8px}
.msgB.mien{background:#EAF3EC;border-color:#B7D4BE}
body.nuit .msgB.mien{background:#1E3328;border-color:#2E4A38}
.msgH{display:flex;gap:9px;align-items:center}
.msgH b{font-size:13.5px;color:var(--vert)}
.msgH small{margin-left:auto;font-size:10.5px;color:var(--doux)}
.msgT{font-size:14.5px;margin:7px 0 8px;white-space:pre-wrap;word-break:break-word}
.msgA{display:flex;flex-wrap:wrap;gap:5px}
.reB{border:1.5px solid var(--ligne);background:var(--fond);border-radius:14px;padding:3px 9px;
 font-size:12px;cursor:pointer;font-family:inherit;color:var(--txt)}
.reB.on{border-color:var(--or);background:#FDF3DF}
.reB.sup{margin-left:auto;border-color:#E0BDB4}
.repB{border-left:2.5px solid var(--or);margin:7px 0 0 11px;padding:5px 0 5px 10px}
.repB b{font-size:12.5px;color:var(--vert)}
.repB small{font-size:10px;color:var(--doux);margin-left:5px}
.repB p{font-size:13px;margin-top:2px}
.repE{margin-top:9px;padding-top:9px;border-top:1px dashed var(--ligne)}
.gtT{background:linear-gradient(135deg,#1C7A5F,#0E4739);color:#fff;border-radius:14px;
 padding:12px 15px;font-size:16px;font-weight:700;margin:9px 0}
.dmH{background:#F1E7D2;border-radius:11px;padding:8px 12px;font-size:12px;color:#7A6033;
 margin:9px 0;text-align:center}
body.nuit .dmH{background:#33301F;color:#C9AE72}
.dmB{background:var(--carte);border:1.5px solid var(--ligne);border-radius:15px 15px 15px 4px;
 padding:9px 12px;margin-bottom:7px;max-width:88%}
.dmB.moi{background:#155E4B;color:#FBF6EC;border-color:#155E4B;margin-left:auto;
 border-radius:15px 15px 4px 15px}
.dmB p{font-size:14px;white-space:pre-wrap;word-break:break-word}
.dmB small{display:block;font-size:10px;opacity:.7;margin-top:3px}

/* ── V38 : lot I + ambiance africaine ── */
.hongE{display:flex;gap:11px;align-items:center;background:linear-gradient(135deg,#8C1B1B,#B33327);
 color:#FFE9C7;border-radius:14px;padding:11px 13px;margin-bottom:7px}
.hongE b{color:#FFD98A;font-size:14px}.hongE small{display:block;font-size:11.5px;opacity:.85}
.hongE p{font-size:12.5px;margin-top:3px;font-style:italic}
.hongS{font-size:26px;flex:none}
.arbreB{background:linear-gradient(160deg,#1B6B54,#0E4739);color:#fff;border-radius:18px;
 padding:20px 16px;text-align:center;margin-bottom:9px}
.arbreE{font-size:52px;line-height:1;margin-bottom:6px;animation:pousse 2.6s ease-in-out infinite}
@keyframes pousse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.arbreB b{display:block;color:var(--or);font-size:15px}
.arbreB small{font-size:12px;opacity:.85}
.cadG{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cadB{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--ligne);background:var(--carte);
 font-size:21px;cursor:pointer;transition:transform .12s}
.cadB.on{border-color:var(--or);background:#FDF3DF;transform:scale(1.08)}
.cadV{font-size:28px;flex:none}
.cnt{color:var(--or);font-size:19px;margin-left:6px}
.nasabB{background:linear-gradient(135deg,#0E4739,#155E4B);color:#FBF6EC;border-radius:14px;
 padding:17px 15px;font-family:Georgia,serif;font-size:16px;line-height:1.7;text-align:center;margin:9px 0}
.regB{background:var(--carte);border:1.5px solid var(--ligne);border-radius:14px;padding:11px 13px;margin-top:9px}
.regL{padding:6px 0;border-bottom:1px dashed var(--ligne)}
.regL b{font-size:13.5px}.regL small{display:block;font-size:11.5px;color:var(--doux)}
.tourOn{border-color:var(--or);background:#FDF3DF}
body.nuit .tourOn{background:#2A2A1C}
.parrG{display:flex;gap:9px;justify-content:center;margin-bottom:9px}
.parrC{width:46px;height:46px;border-radius:50%;border:2px dashed var(--ligne);display:grid;place-items:center;
 font-size:19px;color:var(--doux)}
.parrC.on{border-style:solid;border-color:var(--or);background:var(--or);color:#fff}
/* ── ambiance ── */
.splash{position:fixed;inset:0;z-index:99999;background:#0E4739;display:flex;flex-direction:column;
 justify-content:space-between;transition:opacity .5s}
.splash.off{opacity:0}
.spB{display:flex;height:26px;overflow:hidden}
.spB i{flex:1;height:100%}
.spB i:nth-child(4n+1){background:#D89A2B}.spB i:nth-child(4n+2){background:#8C3B22}
.spB i:nth-child(4n+3){background:#2E3A87}.spB i:nth-child(4n){background:#FBF6EC}
.spT i{animation:tisse .9s ease-out both}.spBt i{animation:tisse .9s ease-out both reverse}
@keyframes tisse{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.spC{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:20px}
.spLogo{font-size:64px;color:#D89A2B;animation:entre .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes entre{from{transform:scale(.3) rotate(-40deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.spN{color:#FBF6EC;font-size:23px;font-weight:800;letter-spacing:-.4px;animation:monte .7s .3s both;
 font-family:'Unbounded',Georgia,sans-serif;text-align:center}
.spS{color:#9CBFB2;font-size:13px;text-align:center;animation:monte .7s .5s both;max-width:280px}
@keyframes monte{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.spPts{display:flex;gap:7px;margin-top:14px}
.spPts b{width:8px;height:8px;border-radius:50%;background:#D89A2B;animation:sautr 1s infinite}
.spPts b:nth-child(2){animation-delay:.15s}.spPts b:nth-child(3){animation-delay:.3s}
@keyframes sautr{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-7px);opacity:1}}
.ripple{position:absolute;border-radius:50%;background:rgba(216,154,43,.42);width:14px;height:14px;
 margin:-7px 0 0 -7px;pointer-events:none;animation:onde .5s ease-out forwards}
@keyframes onde{to{transform:scale(13);opacity:0}}
button,.tuile,.membre,.carte{position:relative;overflow:hidden}
.tk{background:linear-gradient(90deg,#155E4B,#1B6B54);color:#FBF6EC;border-radius:11px;
 overflow:hidden;margin-bottom:11px;height:32px;display:flex;align-items:center;
 border-left:4px solid var(--or)}
.tkR{display:flex;white-space:nowrap;animation:defile 26s linear infinite}
.tkR span{padding:0 22px;font-size:12.5px;font-weight:600}
@keyframes defile{from{transform:translateX(0)}to{transform:translateX(-50%)}}
nav button:nth-child(6){animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@media(prefers-reduced-motion:reduce){.spT i,.spBt i,.spLogo,.spN,.spS,.spPts b,.tkR,
 .arbreE,nav button:nth-child(6),.ripple{animation:none!important}}

/* ── V37 : lot H ── */
.avL{width:40px;height:40px;flex-shrink:0;border-radius:50%;background:var(--fond);display:grid;
 place-items:center;font-size:20px;border:2px solid var(--or)}
.grilleB{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.bg{background:var(--carte);border:1.5px solid var(--ligne);border-radius:14px;padding:12px 8px;text-align:center;opacity:.5}
.bg.on{opacity:1;border-color:var(--or);box-shadow:0 2px 8px rgba(216,154,43,.16)}
.bg i{display:block;font-size:26px;font-style:normal;margin-bottom:4px}
.bg b{display:block;font-size:11.5px;color:var(--vert)}
.bg small{font-size:9.5px;color:var(--doux)}
body.nuit .bg b{color:var(--or)}
body.aine{font-size:18px}
body.aine .hint{font-size:15px}
body.aine .membre b,body.aine .carte b{font-size:17px}
body.aine .tuile b{font-size:12.5px}
body.aine nav button small{font-size:11px}
body.aine .s1 b{font-size:23px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">

/* B — Percussion douce (djembé synthétique) */
function perc(f){
 try{
  if(!SON)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  PERCX=PERCX||new AC();const c=PERCX,t=c.currentTime;
  const o=c.createOscillator(),g=c.createGain();
  o.type='sine';o.frequency.setValueAtTime(f||180,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,(f||180)*0.45),t+0.13);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.16,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.18);
 }catch(e){}
}
let PERCX=null;

/* C — Compteurs qui montent (façon solde MoMo / Wave) */
function animerCompteurs(){
 try{
  document.querySelectorAll('.s1 b').forEach(function(el){
   const fin=parseInt(el.textContent,10);if(isNaN(fin)||fin>9999)return;
   let n=0;const pas=Math.max(1,Math.ceil(fin/16));
   el.textContent='0';
   const it=setInterval(function(){n+=pas;if(n>=fin){n=fin;clearInterval(it)}el.textContent=n},32);
  });
 }catch(e){}
}

document.addEventListener('click',function(e){
 try{

  if(!c)return;
  perc(150+Math.random()*40);
  const r=document.createElement('span');r.className='ripple';
  const b=c.getBoundingClientRect&&c.getBoundingClientRect();
  if(b){r.style.left=((e.clientX||b.left+b.width/2)-b.left)+'px';
        r.style.top=((e.clientY||b.top+b.height/2)-b.top)+'px';}
  c.appendChild(r);setTimeout(function(){r.remove()},520);
 }catch(x){}
},true);

// ══════════ LOT L — Portraits africains & vraies photos ══════════
// Portraits dessinés en SVG à la volée : aucun fichier à télécharger,
// une allure différente pour chaque personne, générée depuis son identifiant.

const PEAUX=['#8D5524','#7A4520','#A0663A','#6B3A17','#B07A4E','#5C3010','#96603A','#7F4B26'];
const TISSUS=['#D89A2B','#8C3B22','#2E3A87','#1C7A5F','#B0442F','#6B4E8C','#C97E1F','#2A6E5E'];
const FONDS=['#F0E4CC','#E6DAC4','#EFE0D0','#E8E2CE','#F1DFC8','#E4DDCB'];

function h32(x){let h=2166136261;const s=String(x);
 for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
 return Math.abs(h)}

/* Portrait SVG : coiffe et vêtement varient selon le sexe, l'âge et la génération */
function portraitSVG(m){
 const g=h32('p'+m.id), fem=(m.g==='f');
 const peau=PEAUX[g%PEAUX.length];
 const tissu=TISSUS[(g>>3)%TISSUS.length];
 const tissu2=TISSUS[(g>>6)%TISSUS.length];
 const fond=FONDS[(g>>9)%FONDS.length];
 const an=m.na||1980, age=(m.dc||new Date().getFullYear())-an;
 const vieux=age>=55, jeune=age<=16;
 const coiffe=fem?((g>>2)%3):((g>>2)%3);   // 0 = tête nue, 1 = foulard/kufi, 2 = grand foulard/turban
 let s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">';
 s+=`<rect width="100" height="100" fill="${fond}"/>`;
 // bandes kente en bas
 for(let i=0;i<10;i++){const c=[tissu,tissu2,'#FBF6EC','#2E3A87'][i%4];
  s+=`<rect x="${i*10}" y="92" width="10" height="8" fill="${c}"/>`}
 // buste / vêtement
 s+=`<path d="M14 92 Q14 68 50 68 Q86 68 86 92 Z" fill="${tissu}"/>`;
 if(fem) s+=`<path d="M50 68 L38 92 L62 92 Z" fill="${tissu2}" opacity=".85"/>`;
 else s+=`<rect x="46" y="68" width="8" height="24" fill="${tissu2}" opacity=".8"/>`;
 // cou + tête
 s+=`<rect x="44" y="56" width="12" height="12" fill="${peau}"/>`;
 s+=`<ellipse cx="50" cy="42" rx="19" ry="22" fill="${peau}"/>`;
 // oreilles
 s+=`<circle cx="30" cy="43" r="4" fill="${peau}"/><circle cx="70" cy="43" r="4" fill="${peau}"/>`;
 if(fem&&((g>>4)&1)) s+=`<circle cx="30" cy="48" r="2.4" fill="#D89A2B"/><circle cx="70" cy="48" r="2.4" fill="#D89A2B"/>`;
 // coiffe
 if(coiffe===2){ // grand foulard (gele) ou turban
  s+=`<path d="M27 34 Q30 12 50 12 Q70 12 73 34 Q62 26 50 26 Q38 26 27 34 Z" fill="${tissu2}"/>`;
  s+=`<ellipse cx="50" cy="16" rx="26" ry="11" fill="${tissu2}"/>`;
  s+=`<ellipse cx="50" cy="15" rx="26" ry="5" fill="${tissu}" opacity=".55"/>`;
 } else if(coiffe===1){
  if(fem){ s+=`<path d="M28 36 Q28 16 50 16 Q72 16 72 36 Q60 28 50 28 Q40 28 28 36 Z" fill="${tissu2}"/>`;
           s+=`<path d="M28 36 Q22 48 26 58 L34 52 Z" fill="${tissu2}"/>`; }
  else   { s+=`<path d="M31 30 Q31 18 50 18 Q69 18 69 30 Z" fill="${tissu2}"/>`;
           s+=`<rect x="30" y="29" width="40" height="4" rx="2" fill="${tissu}"/>`; }
 } else {
  s+=`<path d="M30 36 Q30 18 50 18 Q70 18 70 36 Q60 29 50 29 Q40 29 30 36 Z" fill="${vieux?'#D9D4CC':'#1F1912'}"/>`;
  if(fem) s+=`<circle cx="34" cy="30" r="4" fill="${vieux?'#D9D4CC':'#1F1912'}"/><circle cx="66" cy="30" r="4" fill="${vieux?'#D9D4CC':'#1F1912'}"/>`;
 }
 // yeux
 s+=`<ellipse cx="42" cy="42" rx="3" ry="${jeune?3.4:2.8}" fill="#241C12"/>`;
 s+=`<ellipse cx="58" cy="42" rx="3" ry="${jeune?3.4:2.8}" fill="#241C12"/>`;
 // sourcils
 s+=`<rect x="38" y="35" width="9" height="2" rx="1" fill="${vieux?'#B9B2A6':'#241C12'}"/>`;
 s+=`<rect x="53" y="35" width="9" height="2" rx="1" fill="${vieux?'#B9B2A6':'#241C12'}"/>`;
 // nez + bouche
 s+=`<path d="M50 45 Q47 51 50 52 Q53 51 50 45" fill="rgba(0,0,0,.18)"/>`;
 s+=`<path d="M44 57 Q50 61 56 57" stroke="#3A2415" stroke-width="2" fill="none" stroke-linecap="round"/>`;
 // barbe pour les hommes âgés
 if(!fem&&vieux) s+=`<path d="M32 46 Q34 68 50 68 Q66 68 68 46 Q60 62 50 62 Q40 62 32 46 Z" fill="${age>70?'#EFECE6':'#2A2015'}" opacity=".92"/>`;
 else if(!fem&&age>=28&&((g>>5)&1)) s+=`<path d="M40 58 Q50 66 60 58 Q50 62 40 58 Z" fill="#2A2015"/>`;
 // liseré doré du défunt
 if(m.dc) s+=`<circle cx="50" cy="50" r="48" fill="none" stroke="#D89A2B" stroke-width="4" stroke-dasharray="6 4"/>`;
 s+='</svg>';
 return 'data:image/svg+xml;utf8,'+encodeURIComponent(s);
}

function srcPortrait(m){const P=sg('photos',{});return P[m.id]||portraitSVG(m)}

/* Import d'une vraie photo depuis le téléphone, réduite avant stockage */
function choisirPhoto(id){
 try{
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){
   const f=inp.files&&inp.files[0];if(!f)return;
   const r=new FileReader();
   r.onload=function(){
    const im=new Image();
    im.onload=function(){
     const T=256,c=document.createElement('canvas');c.width=T;c.height=T;
     const x=c.getContext('2d');
     const co=Math.min(im.width,im.height);
     x.drawImage(im,(im.width-co)/2,(im.height-co)/2,co,co,0,0,T,T);
     const P=sg('photos',{});P[id]=c.toDataURL('image/jpeg',0.72);
     try{ss('photos',P)}catch(e){return toast(T2('sPhotoLourde'))}
     fete();toutRendre();if(typeof FICHE!=='undefined'&&FICHE===id)ouvrir(id);
    };im.src=r.result;
   };r.readAsDataURL(f);
  };inp.click();
 }catch(e){}
}
function retirerPhoto(id){const P=sg('photos',{});delete P[id];ss('photos',P);
 bip(240);toutRendre();if(typeof FICHE!=='undefined'&&FICHE===id)ouvrir(id)}
function T2(k){try{return T(k)}catch(e){return k}}

const PH_TAILLE=224, PH_QUAL=0.68;

function poidsPhotos(){
 const P=sg('photos',{});let o=0;
 Object.values(P).forEach(v=>{o+=v.length*0.75});
 return o}
function fmtPoids(o){return o>1048576?(o/1048576).toFixed(1)+' Mo':Math.round(o/1024)+' Ko'}

/* Réduit une image avant stockage : carré, 224 px, JPEG */
function reduireImage(fichier){
 return new Promise(function(ok,ko){
  const r=new FileReader();
  r.onerror=ko;
  r.onload=function(){
   const im=new Image();
   im.onerror=ko;
   im.onload=function(){
    try{
     const c=document.createElement('canvas');c.width=PH_TAILLE;c.height=PH_TAILLE;
     const x=c.getContext('2d');
     const co=Math.min(im.width,im.height);
     x.drawImage(im,(im.width-co)/2,(im.height-co)/2,co,co,0,0,PH_TAILLE,PH_TAILLE);
     ok(c.toDataURL('image/jpeg',PH_QUAL));
    }catch(e){ko(e)}
   };im.src=r.result;
  };r.readAsDataURL(fichier);
 })}

/* Import groupé : plusieurs photos d'un coup, attribuées dans l'ordre affiché */
function importerLot(){
 try{
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';inp.multiple=true;
  inp.onchange=async function(){
   const fs=Array.from(inp.files||[]);if(!fs.length)return;
   const P=sg('photos',{});
   const cibles=M.filter(m=>!P[m.id]).map(m=>m.id);
   let n=0;
   for(let i=0;i<fs.length&&i<cibles.length;i++){
    try{ P[cibles[i]]=await reduireImage(fs[i]); n++; }catch(e){}
   }
   try{ ss('photos',P) }catch(e){ return toast(T('sEspace')) }
   fete();toast(n+' / '+fs.length);toutRendre();rendreStudio();
  };
  inp.click();
 }catch(e){}
}
function photoPour(id){

/* Traditions patronymiques du monde : chacune a sa façon de dire « fils de / fille de » */
const TRADS=[
 ['neutre','fils de','fille de','Neutre'],
 ['ar','ibn','bint','العربية'],
 ['he','ben','bat','עברית'],
 ['is','-son','-dóttir','Ísland'],
 ['ru','-ovitch','-ovna','Русский'],
 ['ga','Mac','Nic','Gaeilge'],
 ['cy','ap','ferch','Cymraeg'],
 ['et','walda','walat','ኢትዮጵያ'],
 ['nl','van','van','Nederlands'],
 ['es','-ez','-ez','España'],
 ['en','son of','daughter of','English'],
 ['pt','filho de','filha de','Português']
];
function tradAct(){const i=sg('trad',0);return TRADS[Math.min(i,TRADS.length-1)]}
function chaineNoms(dep){
 const A=ancetres(dep),t=tradAct(),suf=t[0]==='is'||t[0]==='ru'||t[0]==='es';
 const p1=m=>(m.nom||'').split(' ')[0];
 if(!A.length)return '';
 let s=p1(A[0]);
 for(let i=1;i<A.length;i++){
  const lien=(i===1)?(dep.g==='f'?t[2]:t[1]):t[1];
  s+= suf ? ' '+p1(A[i])+lien : ' '+lien+' '+p1(A[i]);
 }
 return s;
}
